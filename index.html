        }

            background-color: #3498db;

        }

        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #e9ecef;
            transition: all 0.2s;
            font-size: 16px;
            text-align: left;
        }
        .option:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
        }

            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .option.incorrect {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        .option.disabled {

        }
        .next-btn {

            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: none;
            width: 100%;
            transition: background 0.2s;
        }
        .next-btn:hover {
            background-color: #27ae60;
        }
        .score {

            font-size: 14px;
            color: #7f8c8d;

let correctCount = 0;
let totalCount = 0;
let currentItem = null;
let hasAnswered = false;

// 随机打乱数组的辅助函数
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

// 朗读第一列汉字的语音函数
function playAudio() {
    if (!currentItem) return;
    // 使用浏览器自带的文本转语音(TTS)引擎
    const utterance = new SpeechSynthesisUtterance(currentItem.hanzi);
    utterance.lang = 'zh-CN'; // 设置为中文普通话发音
    utterance.rate = 0.9;     // 控制语速，略微放慢方便听清
    window.speechSynthesis.cancel(); // 停止当前正在播放的声音
    window.speechSynthesis.speak(utterance);
}

// 加载新题目
function loadQuestion() {
    hasAnswered = false;
    document.getElementById('next-btn').style.display = 'none';
    
    // 随机抽取一个词汇
    const randomIndex = Math.floor(Math.random() * vocabData.length);
    currentItem = vocabData[randomIndex];
    
    // UI 展现第二列的 Hanzi 伴随 Pinyin
    document.getElementById('question-text').innerText = currentItem.pinyin;
    
    // 自动触发朗读第一列汉字
    // 注：由于现代浏览器安全策略，首次加载需要用户点击屏幕任意地方后，后续关卡才会完美自动发音
    setTimeout(() => { playAudio(); }, 400);

    // 过滤出所有错误的干扰英文选项
    let incorrectAnswers = vocabData
        .filter(item => item.english !== currentItem.english)
        .map(item => item.english);
    
    // 随机打乱并挑选3个错误答案
    incorrectAnswers = shuffle(incorrectAnswers).slice(0, 3);
    
    // 组合正确答案与错误答案
    let options = [currentItem.english, ...incorrectAnswers];
    // 再次打乱这4个选项的顺序
    options = shuffle(options);
    
    // 渲染生成 DOM 节点
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    options.forEach(option => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerText = option;
        div.onclick = () => checkAnswer(div, option);
        container.appendChild(div);
    });
}

// 检查答案逻辑
function checkAnswer(selectedElement, selectedOption) {
    if (hasAnswered) return; // 防止重复点击
    hasAnswered = true;
    totalCount++;
    
    const options = document.querySelectorAll('.option');
    options.forEach(opt => {
        opt.classList.add('disabled'); // 锁定所有选项
        // 无论选对选错，均高亮正确答案
        if (opt.innerText === currentItem.english) {
            opt.classList.add('correct');
        }
    });
    
    // 判断是否答对
    if (selectedOption === currentItem.english) {
        correctCount++;
    } else {
        // 如果选错，额外将玩家选错的那个选项标红
        selectedElement.classList.add('incorrect');
    }
    
    // 更新成绩状态栏和显示下一题按钮
    document.getElementById('score-text').innerText = `正确: ${correctCount} | 总计: ${totalCount}`;
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    loadQuestion();
}

// 页面加载完成后自动启动第一题
window.onload = loadQuestion;
</script>
